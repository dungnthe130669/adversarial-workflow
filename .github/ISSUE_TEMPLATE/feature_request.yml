name: Feature Request
description: Suggest a new workflow or enhancement to an existing one
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new workflow or improvement? We'd love to hear it!

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief description of the feature you're requesting.
      placeholder: I'd like adversarial-workflow to support...
    validations:
      required: true

  - type: dropdown
    id: workflow
    attributes:
      label: Related Workflow
      description: Which workflow does this relate to? (Select "new workflow" if proposing something new.)
      options:
        - new workflow
        - adversarial-bugfix
        - adversarial-feature
        - adversarial-security
        - adversarial-review
        - adversarial-tests
        - adversarial-deps
        - adversarial-rca
        - adversarial-debt
        - adversarial-migration
        - adversarial-crates
        - adversarial-scaffold
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why do you need this? What problem does it solve?
      placeholder: Currently, when I try to..., there's no good way to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: |
        A new workflow `adversarial-X` that:
        1. Spawns N agents to...
        2. Runs them in parallel via parallel()...
        3. Produces output file Y...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried any workarounds or alternative approaches?
      placeholder: I tried... but it doesn't work because...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references that might help.
    validations:
      required: false
