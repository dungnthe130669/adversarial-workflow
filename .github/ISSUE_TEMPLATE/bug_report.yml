name: Bug Report
description: Report a bug in an adversarial-workflow workflow
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      description: Which workflow is affected?
      options:
        - adversarial-bugfix
        - adversarial-feature
        - adversarial-security
        - adversarial-review
        - adversarial-tests
        - adversarial-deps
        - adversarial-rca
        - adversarial-debt
        - adversarial-migration
        - adversarial-crates
        - adversarial-scaffold
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Run `adversarial-bugfix` in a repo with...
        2. Observe that...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, I got...
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Output of `node --version`
      placeholder: e.g. v20.12.0
    validations:
      required: false

  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code Version
      description: Output of `claude --version`
      placeholder: e.g. 1.2.3
    validations:
      required: false
